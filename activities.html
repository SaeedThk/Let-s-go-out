<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Activities</title>
    <link rel="stylesheet" href="css/activities.css" />
  </head>
  <body>
    <div id="activityquestion"><b>What are we doing after?</b></div>
    
    <form id="activityForm" action="https://formspree.io/f/mojlgvwl" method="POST">
      
      <div class="activities-selection">
        <div class="activity-item">
          <img src="activities/aquarium.jpeg" alt="aquarium" />
          <label>
            <input type="checkbox" name="activities" value="aquarium" />
            aquarium
          </label>
        </div>
        <div class="activity-item">
          <img src="activities/arcade.jpeg" alt="arcade" />
          <label>
            <input type="checkbox" name="activities" value="arcade" />
            arcade
          </label>
        </div>
        <div class="activity-item">
          <img src="activities/cinema.jpeg" alt="cinema" />
          <label>
            <input type="checkbox" name="activities" value="cinema" />
            cinema
          </label>
        </div>
        <div class="activity-item">
          <img src="activities/keramika.jpeg" alt="ceramics" />
          <label>
            <input type="checkbox" name="activities" value="ceramics" />
            ceramics
          </label>
        </div>
        <div class="activity-item">
          <img src="activities/kunsthalle.jpeg" alt="kunsthalle" />
          <label>
            <input type="checkbox" name="activities" value="kunsthalle" />
            exhibition
          </label>
        </div>
        <div class="activity-item">
          <img src="activities/park.jpeg" alt="park.jpeg" />
          <label>
            <input type="checkbox" name="activities" value="park.jpeg" />
            park
          </label>
        </div>
      </div>

      <button class="button" type="submit">
        Last page
      </button>
      
    </form>

    <script>
      // STEP 2: This looks for "activityForm". If the ID above is missing, this fails.
      var form = document.getElementById("activityForm");
      
      form.addEventListener("submit", function(event) {
          event.preventDefault(); // This stops the "Thanks" page from appearing
          
          var data = new FormData(form);
          
          fetch(form.action, {
              method: form.method,
              body: data,
              headers: {
                  'Accept': 'application/json'
              }
          }).then(response => {
              if (response.ok) {
                  // STEP 3: Redirect to your final page
                  window.location.href = "lastpage.html"; 
              } else {
                  alert("Oops! There was a problem submitting your form");
              }
          });
      });
    </script>
  </body>
</html>
