<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Date</title>
    <link rel="stylesheet" href="css/date.css" />
  </head>
  <body>
    <h1 title="choose a date">Are you free on ...</h1>
    
    <form id="dateForm" class="form-group" action="https://formspree.io/f/xlglqydk" method="POST">
      <label>Which day: (select a date)</label>
      <div>
        <input type="date" name="date_picked" required />
        <button class="button" type="submit">Submit</button>
      </div>
    </form>

    <script>
      var form = document.getElementById("dateForm");
      form.addEventListener("submit", function(event) {
          event.preventDefault(); // Stop standard redirect
          var data = new FormData(form);
          fetch(form.action, {
              method: form.method,
              body: data,
              headers: { 'Accept': 'application/json' }
          }).then(response => {
              if (response.ok) {
                  window.location.href = "food.html"; // Redirect to Food page
              } else {
                  alert("Oops! There was a problem submitting your form");
              }
          });
      });
    </script>
  </body>
</html>
