<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Be My Valentine</title>
    <link rel="stylesheet" href="css/valentine.css" />
  </head>
  <body>
    <div id="valentineQuestion"><b>Will you be my valentine?</b></div>
    
    <form action="https://formspree.io/f/mojlgvwl" method="POST">
        <input type="hidden" name="_next" value="https://akshitbhalla15.github.io/Valentine/date.html">
        <input type="hidden" name="answer" value="YES">
        
        <button type="submit" class="answerButton" id="yesButton">Yes</button>
    </form>
    <button class="answerButton" id="noButton">No, but</button>
    <br />
    <img src="cat.gif" alt="cat asking question" class="responsive" />

    <script>
      document
        .getElementById("noButton")
        .addEventListener("click", function () {
          // FIX 3: This selector now looks for the ID we added above
          var yesButton = document.getElementById("yesButton");
          
          var currentFontSize = parseInt(
            window.getComputedStyle(yesButton).fontSize
          );
          yesButton.style.fontSize = currentFontSize + 10 + "px"; // Increase font size
        });
    </script>
  </body>
</html>
